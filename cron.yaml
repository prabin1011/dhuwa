
# This file defines the scheduled jobs for your application.
# It will be automatically deployed with your app.
# See https://firebase.google.com/docs/app-hosting/configure#set_up_scheduled_jobs

jobs:
- name: "send-moment-reminders"
  schedule: "*/15 * * * *" # Runs every 15 minutes
  transport: "http"
  http:
    method: "POST"
    uri: "/api/send-reminders"
    headers:
      "Content-Type": "application/json"
      "User-Agent": "Google-Cloud-Scheduler"
      "X-CloudScheduler": "true"
    body: "" # No body needed for this job
  retryConfig:
    retryCount: 3
    minBackoffDuration: 5s
    maxBackoffDuration: 60s
